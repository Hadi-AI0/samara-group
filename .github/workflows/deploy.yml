name: Deploy Multi-Branch Pages

on:
  push:
    branches:
      - main
      - arabic-first-multilingual-site-architecture-f6fe4

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      # 1. Download the Main branch into a temp main folder
      - name: Checkout Main Branch
        uses: actions/checkout@v4
        with:
          ref: main
          path: temp-main

      # 2. Download the Arabic branch into a temp arabic folder
      - name: Checkout Arabic Branch
        uses: actions/checkout@v4
        with:
          ref: arabic-first-multilingual-site-architecture-f6fe4
          path: temp-arabic

      # 3. Assemble the final structure into a new folder named 'public'
      - name: Assemble Combined Site
        run: |
          mkdir public
          # Copy main branch files to the root of public
          cp -r temp-main/* public/ 2>/dev/null || true
          # Create the subfolder inside public
          mkdir -p public/arabic-version
          # Copy arabic branch files into that subfolder
          cp -r temp-arabic/* public/arabic-version/ 2>/dev/null || true
          # Clean up GitHub metadata so it doesn't break the build
          rm -rf public/.github public/arabic-version/.github

      # 4. Standard Pages deployment steps
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
