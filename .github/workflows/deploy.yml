name: Deploy Multi-Branch Pages

on:
  push:
    branches:
      - main
      - arabic-first-multilingual-site-architecture-f6fe4

permissions:
  contents: write

jobs:
  deploy-main:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Main Branch
        uses: actions/checkout@v4

      - name: Deploy Main to Root
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages # Deploys directly to a dedicated static branch
          folder: .
          clean: false # VERY IMPORTANT: Prevents deleting the Arabic folder

  deploy-arabic:
    if: github.ref == 'refs/heads/arabic-first-multilingual-site-architecture-f6fe4'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Arabic Branch
        uses: actions/checkout@v4

      - name: Deploy Arabic to Subfolder
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages # Deploys to the exact same static branch
          folder: .
          target-folder: arabic-version # Safely nests it into the subfolder
          clean: false # VERY IMPORTANT: Prevents deleting the Main files
